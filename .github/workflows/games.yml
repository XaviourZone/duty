name: Build Wrist Arcade games app

on:
  push:
    paths:
      - 'games/**'
      - '.github/workflows/games.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: games
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        working-directory: games
        run: cp app/build/outputs/apk/debug/app-debug.apk "WristArcade-v1.0.${{ github.run_number }}.apk"

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WristArcade-apk
          path: games/WristArcade-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: games-v${{ github.run_number }}
          name: Wrist Arcade build ${{ github.run_number }}
          body: |
            10 games for the M99 watch. Download the APK, test on your phone,
            then send it to the watch with LocalSend.
          files: games/WristArcade-*.apk
          make_latest: false
