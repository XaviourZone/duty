name: Build PowerFace watch app

on:
  push:
    paths:
      - 'watch-app/**'
      - '.github/workflows/watch-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: watch-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        working-directory: watch-app
        run: cp app/build/outputs/apk/debug/app-debug.apk "PowerFace-v1.0.${{ github.run_number }}.apk"

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerFace-apk
          path: watch-app/PowerFace-*.apk

      # A release gives a direct download link that works in the phone's browser.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: powerface-v${{ github.run_number }}
          name: PowerFace build ${{ github.run_number }}
          body: |
            Download the APK below, install it on your phone to test,
            then send it to the watch with LocalSend.
          files: watch-app/PowerFace-*.apk
          make_latest: true
